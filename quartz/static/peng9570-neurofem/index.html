<h1 id="introduction--motivation">Introduction &amp; Motivation</h1>
<h4 id="the-problem"><strong>The Problem:</strong></h4>
<ul>
<li>Modern PDE solver applications require ever larger levels of size and resolution</li>
<li>Modern PDE problems can easily require multiple-billions of individual points of resolution</li>
<li>In Numerical PDE solvers, e.g. the <strong>Finite Element Method (FEM)</strong>, these points map to discretized individual elements in their overall integrative scheme</li>
<li>This is of course is extremely computationally expensive in conventional CPUs</li>
</ul>
<h4 id="the-neuromorphic-solution"><strong>The Neuromorphic Solution:</strong></h4>
<ul>
<li>Analog computing may offer a solution</li>
<li><strong>Spiking Neuromorphic Hardware (NMH)</strong> like Intel's Loihi 2 replicates neuronal dynamics directly in-silico</li>
<li>Continuous deterministic physical dynamics are modeled using discrete event-driven sparse spikes in a Spiking Neural Network (SNN) model</li>
<li>Extreme parallelization, high speed, and low power</li>
</ul>
<h4 id="the-challenge"><strong>The Challenge:</strong></h4>
<ul>
<li>Implementing the FEM in an SNN is not a straightforward problem</li>
<li>Not only in mapping a FEM solver into an SNN structure</li>
<li>But also solving continuous valued problems in discretized spiking dynamics</li>
</ul>
</section>

<h1 id="introducing-neurofem">Introducing NeuroFEM</h1>
<p><em><strong>Theilman and Aimone (2025)</strong></em> introduce an SNN implmentation of the FEM numerical solver [1]</p>
<h4 id="neurofem-maps-the-discretized-mesh-of-a-fem-pde-solver-directly-into-an-snn"><strong>NeuroFEM</strong> maps the discretized mesh of a FEM PDE solver directly into an SNN</h4>
<ul>
<li data-marpit-fragment="1">Where each mesh node represents a discrete basis function in the FEM mesh, composed of a small local population of excitatory-inhibitory balanced integrate-and-fire neurons with recurrent connections</li>
<li data-marpit-fragment="2">Mesh nodes are sparsely interconnected according to the mesh topology, e.g. tessellated across the surface on a disc</li>
</ul>
</section>

<h1 id="introducing-neurofem-2">Introducing NeuroFEM</h1>
<p><em><strong>Theilman and Aimone (2025)</strong></em> introduce an SNN implmentation of the FEM numerical solver [1]</p>
<h4 id="an-snn-implementation-of-a-proportional-integral-pi-controller"><strong>An SNN implementation of a Proportional-Integral (PI) controller</strong></h4>
<ul>
<li>The NeuroFEM builds on the balanced spiking network of Boerlin, Machens, and Denève (2013) [^2] which was <strong>Proportional only</strong> leaving a persistent steady-state offset</li>

<h1 id="computational-implementation">Computational Implementation</h1>
<ul>
<li data-marpit-fragment="1"><strong>Local Environment:</strong>
<ul>
<li data-marpit-fragment="2">Evaluated end-to-end on conventional CPU using Python 3.12.</li>
<li data-marpit-fragment="3">Notebooks: <code>NeuroFEM_Annotated.ipynb</code> and <code>NeuroFEM_Sweep.ipynb</code>.</li>
<li data-marpit-fragment="4">Dependencies: NumPy, SciPy, Matplotlib, MeshPy/Triangle, <code>tqdm</code>.</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>Workflow Pipeline:</strong>

<h1 id="limitations-of-simulated-benchmarks">Limitations of Simulated Benchmarks</h1>
<p>While our CPU simulation validates the <strong>mathematical framework</strong> of NeuroFEM, it omits key <strong>hardware-level advantages</strong> of real neuromorphic deployment:</p>
<ol>
<li><strong>Energy &amp; Power Constraints:</strong>
<ul>
<li data-marpit-fragment="1">Loihi 2 leverages sparse, asynchronous event-driven pulses to consume microjoules per inference.</li>
<li data-marpit-fragment="2">CPU simulations must calculate full floating-point equations for all nodes at every timestep, losing the physical energy scaling advantage.</li>
</ul>
</li>
<li><strong>Fixed-Point Quantization:</strong>
<ul>
<li data-marpit-fragment="3">Loihi 2 utilizes custom bit-width fixed-point integer values.</li>
<li data-marpit-fragment="4">Our simulation assumes double-precision floating-point, hiding numerical precision bounds.</li>
</ul>
</li>
</ol>
</section>

<h1 id="conclusions--next-steps">Conclusions &amp; Next Steps</h1>
<ul>
<li data-marpit-fragment="1"><strong>Conclusions:</strong>
<ul>
<li data-marpit-fragment="2">Replicated the full NeuroFEM methodological chain.</li>
<li data-marpit-fragment="3">Verified that PI controller successfully eliminates steady-state solution offsets.</li>
<li data-marpit-fragment="4">Replicated baseline convergence, online forcing function transition, and parameter scaling sweeps.</li>
</ul>
</li>
<li data-marpit-fragment="5"><strong>Next Steps &amp; Extensions:</strong>
<ul>
<li data-marpit-fragment="6">Scale SNN models to 3D mechanical and elasticity problems.</li>
<li data-marpit-fragment="7">Explore open-source neuromorphic simulators like the <strong>Lava Software Framework</strong> for closer hardware emulation.</li>
<li data-marpit-fragment="8">Extend sparse mesh compilation paradigms to neural network architecture initialization.</li>
</ul>
</li>
</ul>
</section>
